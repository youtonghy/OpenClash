name: Release

# Push a tag named v<PKG_VERSION> (for example v0.49.002) to publish a release.
# Running it by hand builds the packages from the chosen branch. `version` overrides
# PKG_VERSION for that build only, and `publish` creates the v<version> tag and release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the leading v, for example 0.49.003 (empty: PKG_VERSION from the Makefile)'
        required: false
        default: ''
      publish:
        description: 'Publish a GitHub release (off: build artifacts only)'
        type: boolean
        default: false

permissions:
  contents: read

env:
  # OpenWrt SDK used for the apk package. The package is PKGARCH:=all, so x86/64 is enough.
  SDK_BASE: https://downloads.openwrt.org/snapshots/targets/x86/64

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
          GH_TOKEN: ${{ github.token }}
        run: |
          MAKEFILE_VERSION="$(sed -n 's/^PKG_VERSION:=//p' luci-app-openclash/Makefile)"
          [ -n "$MAKEFILE_VERSION" ] || { echo "::error::PKG_VERSION not found"; exit 1; }
          VERSION="${INPUT_VERSION#v}"
          VERSION="${VERSION:-$MAKEFILE_VERSION}"
          # apk only accepts dotted numbers here, and ipk file names must not contain spaces or slashes
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+)*$'; then
            echo "::error::Version '$VERSION' must look like 0.49.003"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match PKG_VERSION $VERSION"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$PUBLISH" = "true" ] \
            && gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release v$VERSION already exists, pick another version"
            exit 1
          fi
          [ "$VERSION" = "$MAKEFILE_VERSION" ] || echo "::notice::Building $VERSION instead of PKG_VERSION $MAKEFILE_VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  web:
    name: Build web app
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: luci-app-openclash/web
    env:
      ARC_PRO_TOKEN: ${{ secrets.ARC_PRO_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: luci-app-openclash/web/package-lock.json

      - run: npm ci

      # Arc Pro is not in the repository, every build fetches it from the registry
      - name: Fetch Arc components
        run: npm run arc

      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: luci-app-openclash/root/www/luci-static/resources/openclash/app

  ipk:
    name: Build ipk
    needs: [version, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: web-app
          path: luci-app-openclash/root/www/luci-static/resources/openclash/app

      - name: Set version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=$VERSION/" luci-app-openclash/Makefile

      - name: Build
        run: |
          mkdir -p dist
          bash luci-app-openclash/tools/build-ipk.sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: ipk
          path: dist/*.ipk

  apk:
    name: Build apk
    needs: [version, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: web-app
          path: luci-app-openclash/root/www/luci-static/resources/openclash/app

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential libncurses-dev gawk zstd python3 python3-setuptools rsync file unzip

      - name: Download SDK
        run: |
          curl -fsSL --retry 3 "$SDK_BASE/sha256sums" -o sha256sums
          SDK_NAME="$(grep -oE 'openwrt-sdk-[^ ]+\.tar\.zst' sha256sums | head -n1)"
          [ -n "$SDK_NAME" ] || { echo "::error::No SDK listed in $SDK_BASE/sha256sums"; exit 1; }
          curl -fSL --retry 3 "$SDK_BASE/$SDK_NAME" -o "$SDK_NAME"
          grep " \*\?$SDK_NAME\$" sha256sums | sha256sum -c -
          mkdir sdk
          tar --zstd -xf "$SDK_NAME" -C sdk --strip-components=1

      - name: Set version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=$VERSION/" luci-app-openclash/Makefile

      - name: Install po2lmo
        run: |
          make -C luci-app-openclash/tools/po2lmo
          sudo make -C luci-app-openclash/tools/po2lmo install

      - name: Build
        run: |
          cp -R luci-app-openclash sdk/package/luci-app-openclash
          rm -rf sdk/package/luci-app-openclash/web sdk/package/luci-app-openclash/tools
          cd sdk
          make defconfig
          make package/luci-app-openclash/compile V=s -j1
          mkdir -p ../dist
          find bin -name 'luci-app-openclash-*.apk' -exec cp {} ../dist/ \;
          ls ../dist/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk

  release:
    name: Publish
    needs: [version, ipk, apk]
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      # Only the packages: the web-app artifact is an intermediate build output, not a release asset
      - uses: actions/download-artifact@v4
        with:
          pattern: '*pk'
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          cp install.sh dist/
          (cd dist && sha256sum luci-app-openclash* install.sh > sha256sums.txt && cat sha256sums.txt)
          cat > notes.md <<EOF
          One-click install on OpenWrt:

          \`\`\`sh
          wget -qO- https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install.sh | sh
          \`\`\`

          - \`luci-app-openclash_*.ipk\`: OpenWrt with opkg (24.10 and older)
          - \`luci-app-openclash-*.apk\`: OpenWrt with apk (25.12 and newer)
          EOF
          # A re-run of a tag build refreshes the assets; manual runs were checked for an existing release
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes-file notes.md \
              --generate-notes \
              --latest
          fi

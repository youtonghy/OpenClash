name: Check

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: luci-app-routerclash/web
    env:
      # Arc Pro is not in the repository: the components are fetched from the registry with this token.
      # Forks and pull requests from forks have no access to it, so they skip the web build.
      ARC_PRO_TOKEN: ${{ secrets.ARC_PRO_TOKEN }}
      HAS_ARC_TOKEN: ${{ secrets.ARC_PRO_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v6

      - name: Arc token unavailable
        if: env.HAS_ARC_TOKEN != 'true'
        run: echo "::notice::ARC_PRO_TOKEN is not available here, skipping the web build."

      - uses: actions/setup-node@v4
        if: env.HAS_ARC_TOKEN == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: luci-app-routerclash/web/package-lock.json

      - name: Install dependencies
        if: env.HAS_ARC_TOKEN == 'true'
        run: npm ci

      - name: Fetch Arc components
        if: env.HAS_ARC_TOKEN == 'true'
        run: npm run arc

      - name: Lint
        if: env.HAS_ARC_TOKEN == 'true'
        run: npx oxlint src/pages src/lib src/App.tsx

      - name: Type check and build
        if: env.HAS_ARC_TOKEN == 'true'
        run: npm run build

      - uses: actions/upload-artifact@v4
        if: env.HAS_ARC_TOKEN == 'true'
        with:
          name: web-app
          path: luci-app-routerclash/root/www/luci-static/resources/routerclash/app
          retention-days: 7

  package:
    name: Package
    needs: web
    # Still runs when the web build was skipped (no token); the ipk then has no UI
    if: ${{ !cancelled() && needs.web.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: web-app
          path: luci-app-routerclash/root/www/luci-static/resources/routerclash/app

      - name: Install tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get -y install lua5.1 ruby

      - name: Lua syntax
        run: |
          find luci-app-routerclash/luasrc luci-app-routerclash/root -name '*.lua' -print0 \
            | xargs -0 -n1 luac5.1 -p

      - name: Shell syntax
        run: |
          set -e
          for f in luci-app-routerclash/root/etc/init.d/routerclash \
                   luci-app-routerclash/root/usr/share/routerclash/*.sh \
                   luci-app-routerclash/tools/build-ipk.sh \
                   install.sh; do
            bash -n "$f"
          done
          sh -n install.sh

      - name: Ruby syntax
        run: |
          find luci-app-routerclash/root -name '*.rb' -print0 | xargs -0 -n1 ruby -c >/dev/null

      - name: Translations compile
        run: |
          make -C luci-app-routerclash/tools/po2lmo
          for po in luci-app-routerclash/po/zh-cn/*.po; do
            luci-app-routerclash/tools/po2lmo/src/po2lmo "$po" "/tmp/$(basename "${po%.po}").lmo"
          done

      - name: Build ipk
        run: |
          mkdir -p dist
          bash luci-app-routerclash/tools/build-ipk.sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: luci-app-routerclash-ipk-${{ github.sha }}
          path: dist/*.ipk
          retention-days: 7
